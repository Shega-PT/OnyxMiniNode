; =====================================================================
; platformio.ini — OnyxMiniNode
; ---------------------------------------------------------------------
; Duas decisões deliberadas neste ficheiro, e ambas são sobre
; reprodutibilidade. O resto é a configuração mínima que o PlatformIO
; aceita.
;
; ## Por que é que a plataforma e a board estão fixadas por versão
;
; `platform = espressif32` sem versão significa «a última publicada».
; Uma dependência que muda sozinha entre duas compilações da mesma
; fonte produz dois firmwares diferentes com o mesmo número de
; versão — e quando um deles avaria, não há forma de saber qual
; estava em causa. O mesmo vale para a board: `esp32doit-devkit-v1`
; descreve um hardware que existe em duas variantes de pino, e a
; diferença entre elas muda o que está ligado ao onde.
;
; Por isso as duas estão fixadas. Actualizar é uma alteração
; intencional, num commit que diz «actualizei X de A para B», e não
; um efeito colateral de alguém que carregou num botão.
;
; ## Por que é que o framework é `arduino` e não `espidf`
;
; O ESP-IDF é o framework oficial e é melhor. Não é o que este
; projecto usa, por três razões concretas:
;
;   1. O `arduino` é o único framework que a maioria das placas
;      compradas por €5 traz com um toolchain utilizável e já
;      instalado. A promessa do OnyxChat é «qualquer pessoa pode ter
;      um nó de rede» — e um nó que exige 2 GB de toolchain não é
;      essa promessa para quem não tem espaço nem tempo.
;   2. O SHA-256 de hardware continua acessível sem ESP-IDF. O
;      ESP32 traz o acelerador, mas a API `esp_sha256_*` do ESP-IDF
;      não é a única porta: o mbedTLS incluído no core Arduino
;      também usa o periférico. Ver `src/mailbox.cpp` §SHA-256.
;   3. O núcleo do relay é C++ que não depende de framework nenhum.
;      O `test/` compila-o para host, o que permite testar o
;      protocolo sem placa nenhuma ligada. Com ESP-IDF isso exigiria
;      QEMU; aqui é o compilador do sistema.
;
; A contrapartida está escrita e não é escondida: este core é
; construído sobre o ESP-IDF 4.4.7. Ver `docs/ameacas.md`.
; =====================================================================

[env:devkitv1]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino

; A velocidade de uploading não é um detalhe. A 460800 baud, uma
; gravação de ~900 KB leva quase meio minuto; a 921600, metade. O
; valor mais alto é instável em cabo USB barato e em alguns
; adaptadores serial, que é o caso mais comum numa placa comprada como
; peça avulsa. Os 460800 que a board declara são o ponto onde ainda
; funciona em tudo, e é por isso que não se sobe.
upload_speed = 460800

; ---------------------------------------------------------------------
; Os limites do nó
; ---------------------------------------------------------------------
; Estes quatro números são os mesmos de `docs/protocolo.md` §Limites e
; os mesmos que a implementação de referência do OnyxChat usa. Não
; são ajustes de gosto: são o contrato de retenção do protocolo, e
; mudá-los aqui sem os mudar no OnyxChat produz um nó que aceita
; mensagens que o outro lado não espera, ou que as perde sem dizer a
; ninguém.
;
; A memória é o que obriga a reduzir o tamanho. Uma placa DEVKIT V1
; com ESP32-WROOM-32 tem 520 KB de SRAM no papel, mas a definição da
; placa declara `maximum_ram_size` de 320 KB — é o que sobra depois do
; Wi-Fi, do lwIP e do FreeRTOS. `docs/protocolo.md` §A aritmética
; dos 320 KB tem a conta inteira.
build_flags =
    -D MININODE_TTL_S=300
    -D MININODE_MAX_PENDENTES=12
    -D MININODE_MAX_CORPO=4096
    -D MININODE_ENVIOS_POR_S=32

monitor_speed = 115200

; ---------------------------------------------------------------------
; O ambiente de host
; ---------------------------------------------------------------------
; `platform = native` compila o mesmo código C++ para o computador, sem
; ESP-IDF e sem placa. É o que permite testar o protocolo a quem não
; tem hardware, e é o portão que corre em cada alteração.
;
; Não é uma plataforma de produção: aparece aqui apenas para o
; `pio test -e native`, e um erro que a confundisse com a outra
; acabaria por ser corrigido no sítio errado. É por isso que os
; `build_flags` dos limites **não** estão repetidos abaixo — vivem só
; em `[env:devkitv1]`, onde têm efeito. Repetidos, dariam a ilusão de
; que o host testa o mesmo firmware, e não testa.
;
; A plataforma `native` descarrega um compilador. É um download
; pequeno e é a única dependência que este repositório tem fora do
; que a placa traz.
[env:native]
platform = native
test_framework = unity
